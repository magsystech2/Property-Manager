server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Settings change with the environment: never cache.
    location = /config.js { add_header Cache-Control "no-store" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # Built assets have content hashes in their names.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # Single-page app: every other path loads the app.
    location / { try_files $uri /index.html; }
}
