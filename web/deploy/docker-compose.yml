# Run on the Docker host (the Debian LXC on Proxmox). From this folder:
#   cp .env.example .env            # fill in your Supabase values (and one HTTPS option below)
#   docker compose up -d --build                       # app only, on http://<lxc-ip>:8080
#   docker compose --profile tailscale up -d --build   # + Tailscale (private HTTPS from anywhere, no domain)
#   docker compose --profile tunnel up -d --build      # + Cloudflare Tunnel (HTTPS, no open ports)
#   docker compose --profile caddy up -d --build       # + Caddy (HTTPS on ports 80/443, needs port forwarding)
services:
  ledger-web:
    build: ..
    image: project-ledger-web:latest
    container_name: ledger-web
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${LEDGER_PORT:-8080}:80"

  # Recommended without a domain: Tailscale. Gives https://ledger.<your-tailnet>.ts.net,
  # reachable only by devices signed in to your tailnet (each partner installs the Tailscale app).
  # In the Tailscale admin console: DNS -> enable MagicDNS and HTTPS certificates, then
  # Settings -> Keys -> generate an auth key and put it in .env as TS_AUTHKEY.
  # Userspace networking, so it works in an unprivileged LXC without /dev/net/tun.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:v1.76.6
    container_name: ledger-tailscale
    hostname: ${TS_HOSTNAME:-ledger}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    depends_on: [ledger-web]

  # Option A: Cloudflare Tunnel. Free HTTPS from anywhere, nothing opened on your router.
  # Create the tunnel in Cloudflare Zero Trust -> Networks -> Tunnels, add a public hostname
  # (e.g. ledger.yourdomain.com) pointing to http://ledger-web:80, and paste its token in .env.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.11.1
    container_name: ledger-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [ledger-web]

  # Option B: Caddy with an automatic Let's Encrypt certificate.
  # Needs a DNS A record for LEDGER_DOMAIN pointing at your public IP, and your router
  # forwarding ports 80 and 443 to this LXC.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.8-alpine
    container_name: ledger-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${LEDGER_DOMAIN:-localhost} --to ledger-web:80
    volumes: [caddy-data:/data]
    depends_on: [ledger-web]

volumes:
  caddy-data:
  tailscale-state:
