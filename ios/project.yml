name: ProjectLedger
options:
  bundleIdPrefix: com.projectledger
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  LedgerCore:
    path: LedgerCore
targets:
  ProjectLedger:
    type: application
    platform: iOS
    sources:
      - ProjectLedger
    # Info.plist keys that build settings can't express: open PDFs and photos from Mail, Files or Photos
    # ("Share" / "Open in Project Ledger"). They land in the receipt inbox.
    info:
      path: ProjectLedger/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectledger.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # iPhone, iPad and Mac (Mac Catalyst, "Optimize for Mac"): one SwiftUI app, same code.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Project Ledger
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan receipts, invoices and payment confirmations."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Say an expense out loud instead of typing it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn what you say into an expense, on this phone."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach photos of receipts and invoices."
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
schemes:
  ProjectLedger:
    build:
      targets:
        ProjectLedger: all
    test:
      targets: []
