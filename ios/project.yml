name: FlipTracker
options:
  bundleIdPrefix: com.fliptracker
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  FlipTracker:
    type: application
    platform: iOS
    sources:
      - path: FlipTracker
    resources:
      - path: GoogleService-Info.plist
        optional: true
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fliptracker.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flip Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of receipts and bills."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Say an expense out loud to add it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn what you say into an expense."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick receipt photos you already took."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.10"
